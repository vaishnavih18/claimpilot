[alembic]
script_location = migrations

# No sqlalchemy.url here, deliberately - the real URL is resolved at
# runtime by migrations/env.py (via app.core.config.get_database_url()),
# the same resolver the app itself uses. Putting a URL/password in this
# file would mean either committing a secret to the repo or keeping this
# file out of sync with Secrets Manager by hand - env.py importing the
# same resolver means there's exactly one place the connection logic lives.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
